[project]
name = "meru"
version = "0.1.0"
description = "AI-native Linux agent runtime for developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.8",
  "rich>=13.7",
  "structlog>=24.4",
  "typer>=0.12",
]

[project.scripts]
meru = "meru.cli.main:app"

[dependency-groups]
dev = [
  "pyright>=1.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
